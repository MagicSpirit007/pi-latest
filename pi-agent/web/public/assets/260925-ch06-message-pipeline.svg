<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="260925-ch06-message-pipeline-title 260925-ch06-message-pipeline-desc"><title id="260925-ch06-message-pipeline-title">一份会话，几种不同视图</title><desc id="260925-ch06-message-pipeline-desc">display:false 只影响显示；是否发送给模型由转换逻辑决定。</desc><defs><marker id="260925-ch06-message-pipeline-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8e7767"/></marker></defs><style>text{font-family:Geist,"Microsoft YaHei",sans-serif;fill:#1c1917}.title{font-size:29px;font-weight:650}.eyebrow{font:13px Geist,monospace;letter-spacing:2px;fill:#8a7464}.node{font-size:19px;font-weight:600}.body{font-size:18px}.small{font-size:17px;fill:#57534e}.accent{font-size:23px;fill:#b5523a}.source{font:13px Geist,monospace;fill:#8a7464}.edge{fill:none;stroke:#8e7767;stroke-width:1.8;marker-end:url(#260925-ch06-message-pipeline-arrow)}</style><rect width="960" height="720" fill="#faf7f2"/><text x="42" y="48" class="title">一份会话，几种不同视图</text><text x="42" y="78" class="eyebrow">PI SOURCE DIVE  /  v0.87.1</text><rect x="42" y="108" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="108" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="155" class="node">SessionManager 投影</text><text x="367" y="155" class="body">当前分支 + 压缩 + context_edit</text><path d="M332 149H346" class="edge"/><path d="M185 190V205" class="edge"/><rect x="42" y="208" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="208" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="255" class="node">transformContext</text><text x="367" y="255" class="body">应用消息层；可筛选、补充请求上下文</text><path d="M332 249H346" class="edge"/><path d="M185 290V305" class="edge"/><rect x="42" y="308" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="308" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="355" class="node">convertToLlm</text><text x="367" y="355" class="body">自定义消息转换为标准 Message</text><path d="M332 349H346" class="edge"/><path d="M185 390V405" class="edge"/><rect x="42" y="408" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="408" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="455" class="node">normalizeContext</text><text x="367" y="455" class="body">得到 TranscriptContext，系统与工具在消息中</text><path d="M332 449H346" class="edge"/><path d="M185 490V505" class="edge"/><rect x="42" y="508" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="508" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="555" class="node">Provider / API</text><text x="367" y="555" class="body">翻译为供应商请求</text><path d="M332 549H346" class="edge"/><text x="42" y="640" class="small">display:false 只影响显示；是否发送给模型由转换逻辑决定。</text><a href="https://github.com/earendil-works/pi/blob/f07218c4d4bbc12bef056a7058c3dd49dfe41abe/packages/ai/src/utils/transcript.ts" target="_blank"><text x="42" y="698" class="source">packages/ai/src/utils/transcript.ts</text></a></svg>
