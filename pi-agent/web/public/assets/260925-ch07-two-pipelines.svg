<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="260925-ch07-two-pipelines-title 260925-ch07-two-pipelines-desc"><title id="260925-ch07-two-pipelines-title">两条管道，在 Session 层分流</title><desc id="260925-ch07-two-pipelines-desc">“不等待 Promise”不等于不阻塞：普通订阅中的同步工作照样占用调用栈。</desc><defs><marker id="260925-ch07-two-pipelines-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8e7767"/></marker></defs><style>text{font-family:Geist,"Microsoft YaHei",sans-serif;fill:#1c1917}.title{font-size:29px;font-weight:650}.eyebrow{font:13px Geist,monospace;letter-spacing:2px;fill:#8a7464}.node{font-size:19px;font-weight:600}.body{font-size:18px}.small{font-size:17px;fill:#57534e}.accent{font-size:23px;fill:#b5523a}.source{font:13px Geist,monospace;fill:#8a7464}.edge{fill:none;stroke:#8e7767;stroke-width:1.8;marker-end:url(#260925-ch07-two-pipelines-arrow)}</style><rect width="960" height="520" fill="#faf7f2"/><text x="42" y="48" class="title">两条管道，在 Session 层分流</text><text x="42" y="78" class="eyebrow">PI SOURCE DIVE  /  v0.87.1</text><rect x="42" y="108" width="290" height="82" rx="9" fill="#ede9e1" stroke="#d6cec3"/><rect x="350" y="108" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="155" class="node">内核 Agent.subscribe</text><text x="367" y="140" class="body">等待监听器返回的 Promise</text><text x="367" y="168" class="body">把 AgentSession 的工作纳入事件顺序</text><rect x="42" y="208" width="290" height="82" rx="9" fill="#ede9e1" stroke="#d6cec3"/><rect x="350" y="208" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="255" class="node">管道 A：session.subscribe</text><text x="367" y="240" class="body">同步调用监听器，忽略返回的 Promise</text><text x="367" y="268" class="body">适合 UI、日志；异步错误由订阅者处理</text><rect x="42" y="308" width="290" height="82" rx="9" fill="#ede9e1" stroke="#d6cec3"/><rect x="350" y="308" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="355" class="node">管道 B：扩展 pi.on</text><text x="367" y="340" class="body">等待处理器；决策事件读取其返回值</text><text x="367" y="368" class="body">tool_call、context、边界草稿等改变行为</text><text x="42" y="440" class="small">“不等待 Promise”不等于不阻塞：普通订阅中的同步工作照样占用调用栈。</text><a href="https://github.com/earendil-works/pi/blob/f07218c4d4bbc12bef056a7058c3dd49dfe41abe/packages/coding-agent/src/core/extensions/runner.ts" target="_blank"><text x="42" y="498" class="source">packages/coding-agent/src/core/extensions/runner.ts</text></a></svg>
