<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="260925-ch03-streaming-replace-title 260925-ch03-streaming-replace-desc"><title id="260925-ch03-streaming-replace-title">流式输出：更新同一个助手消息槽位</title><desc id="260925-ch03-streaming-replace-desc">一条助手消息可以包含多个文本、思考和工具调用块。</desc><defs><marker id="260925-ch03-streaming-replace-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8e7767"/></marker></defs><style>text{font-family:Geist,"Microsoft YaHei",sans-serif;fill:#1c1917}.title{font-size:29px;font-weight:650}.eyebrow{font:13px Geist,monospace;letter-spacing:2px;fill:#8a7464}.node{font-size:19px;font-weight:600}.body{font-size:18px}.small{font-size:17px;fill:#57534e}.accent{font-size:23px;fill:#b5523a}.source{font:13px Geist,monospace;fill:#8a7464}.edge{fill:none;stroke:#8e7767;stroke-width:1.8;marker-end:url(#260925-ch03-streaming-replace-arrow)}</style><rect width="960" height="520" fill="#faf7f2"/><text x="42" y="48" class="title">流式输出：更新同一个助手消息槽位</text><text x="42" y="78" class="eyebrow">PI SOURCE DIVE  /  v0.87.1</text><rect x="42" y="108" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="108" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="155" class="node">message_start</text><text x="367" y="155" class="body">加入本轮 assistant 占位消息</text><path d="M332 149H346" class="edge"/><path d="M185 190V205" class="edge"/><rect x="42" y="208" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="208" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="255" class="node">message_update × N</text><text x="367" y="240" class="body">用 partial 快照替换该槽位</text><text x="367" y="268" class="body">text_delta 适合逐字显示，不是完整消息</text><path d="M332 249H346" class="edge"/><path d="M185 290V305" class="edge"/><rect x="42" y="308" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="308" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="355" class="node">message_end</text><text x="367" y="340" class="body">用最终 AssistantMessage 替换槽位</text><text x="367" y="368" class="body">完成后供工具解析，并交给 Session 持久化</text><path d="M332 349H346" class="edge"/><text x="42" y="440" class="small">一条助手消息可以包含多个文本、思考和工具调用块。</text><a href="https://github.com/earendil-works/pi/blob/f07218c4d4bbc12bef056a7058c3dd49dfe41abe/packages/agent/src/agent-loop.ts" target="_blank"><text x="42" y="498" class="source">packages/agent/src/agent-loop.ts</text></a></svg>
