<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="260925-ch07-event-nesting-title 260925-ch07-event-nesting-desc"><title id="260925-ch07-event-nesting-title">从一轮结束到会话安定下来</title><desc id="260925-ch07-event-nesting-desc">扩展 turn_end 提前派发一次；普通订阅仍会收到稍后的 turn_end。</desc><defs><marker id="260925-ch07-event-nesting-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8e7767"/></marker></defs><style>text{font-family:Geist,"Microsoft YaHei",sans-serif;fill:#1c1917}.title{font-size:29px;font-weight:650}.eyebrow{font:13px Geist,monospace;letter-spacing:2px;fill:#8a7464}.node{font-size:19px;font-weight:600}.body{font-size:18px}.small{font-size:17px;fill:#57534e}.accent{font-size:23px;fill:#b5523a}.source{font:13px Geist,monospace;fill:#8a7464}.edge{fill:none;stroke:#8e7767;stroke-width:1.8;marker-end:url(#260925-ch07-event-nesting-arrow)}</style><rect width="960" height="720" fill="#faf7f2"/><text x="42" y="48" class="title">从一轮结束到会话安定下来</text><text x="42" y="78" class="eyebrow">PI SOURCE DIVE  /  v0.87.1</text><rect x="42" y="108" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="108" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="155" class="node">finishTurn 边界</text><text x="367" y="155" class="body">Session 持久化消息；扩展 turn_end 可提交草稿</text><path d="M332 149H346" class="edge"/><path d="M185 190V205" class="edge"/><rect x="42" y="208" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="208" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="255" class="node">内核 turn_end</text><text x="367" y="255" class="body">Agent 等待监听器；Session 普通订阅忽略返回值</text><path d="M332 249H346" class="edge"/><path d="M185 290V305" class="edge"/><rect x="42" y="308" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="308" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="355" class="node">agent_end</text><text x="367" y="355" class="body">底层运行完成；Session 处理自动后续工作</text><path d="M332 349H346" class="edge"/><path d="M185 390V405" class="edge"/><rect x="42" y="408" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="408" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="455" class="node">agent_before_settle</text><text x="367" y="455" class="body">允许有效草稿 + continue 再启动一轮</text><path d="M332 449H346" class="edge"/><path d="M185 490V505" class="edge"/><rect x="42" y="508" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="508" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="555" class="node">agent_settled</text><text x="367" y="555" class="body">收尾通知；完成信号发在这里</text><path d="M332 549H346" class="edge"/><text x="42" y="640" class="small">扩展 turn_end 提前派发一次；普通订阅仍会收到稍后的 turn_end。</text><a href="https://github.com/earendil-works/pi/blob/f07218c4d4bbc12bef056a7058c3dd49dfe41abe/packages/coding-agent/src/core/agent-session.ts" target="_blank"><text x="42" y="698" class="source">packages/coding-agent/src/core/agent-session.ts</text></a></svg>
