<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="260925-ch04-translator-5-steps-title 260925-ch04-translator-5-steps-desc"><title id="260925-ch04-translator-5-steps-title">API 适配器的五步工作</title><desc id="260925-ch04-translator-5-steps-desc">这是阅读适配器的教学骨架，各协议的具体组织方式不完全相同。</desc><defs><marker id="260925-ch04-translator-5-steps-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8e7767"/></marker></defs><style>text{font-family:Geist,"Microsoft YaHei",sans-serif;fill:#1c1917}.title{font-size:29px;font-weight:650}.eyebrow{font:13px Geist,monospace;letter-spacing:2px;fill:#8a7464}.node{font-size:19px;font-weight:600}.body{font-size:18px}.small{font-size:17px;fill:#57534e}.accent{font-size:23px;fill:#b5523a}.source{font:13px Geist,monospace;fill:#8a7464}.edge{fill:none;stroke:#8e7767;stroke-width:1.8;marker-end:url(#260925-ch04-translator-5-steps-arrow)}</style><rect width="960" height="720" fill="#faf7f2"/><text x="42" y="48" class="title">API 适配器的五步工作</text><text x="42" y="78" class="eyebrow">PI SOURCE DIVE  /  v0.87.1</text><rect x="42" y="108" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="108" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="155" class="node">① 归一化输入</text><text x="367" y="155" class="body">提示词与工具声明已进入 SystemMessage</text><path d="M332 149H346" class="edge"/><path d="M185 190V205" class="edge"/><rect x="42" y="208" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="208" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="255" class="node">② 构建请求</text><text x="367" y="255" class="body">处理消息格式、模型能力和协议参数</text><path d="M332 249H346" class="edge"/><path d="M185 290V305" class="edge"/><rect x="42" y="308" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="308" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="355" class="node">③ 发送与读取</text><text x="367" y="355" class="body">认证头、请求回调、响应与流式数据</text><path d="M332 349H346" class="edge"/><path d="M185 390V405" class="edge"/><rect x="42" y="408" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="408" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="455" class="node">④ 解析增量</text><text x="367" y="455" class="body">text / thinking / toolcall → 统一事件</text><path d="M332 449H346" class="edge"/><path d="M185 490V505" class="edge"/><rect x="42" y="508" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="508" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="555" class="node">⑤ 完成消息</text><text x="367" y="555" class="body">stopReason、usage、cost；失败编码为 error</text><path d="M332 549H346" class="edge"/><text x="42" y="640" class="small">这是阅读适配器的教学骨架，各协议的具体组织方式不完全相同。</text><a href="https://github.com/earendil-works/pi/blob/f07218c4d4bbc12bef056a7058c3dd49dfe41abe/packages/ai/src/api/anthropic-messages.ts" target="_blank"><text x="42" y="698" class="source">packages/ai/src/api/anthropic-messages.ts</text></a></svg>
