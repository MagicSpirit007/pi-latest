<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="260925-ch06-two-layer-messages-title 260925-ch06-two-layer-messages-desc"><title id="260925-ch06-two-layer-messages-title">内富外严：消息的两层边界</title><desc id="260925-ch06-two-layer-messages-desc">CustomEntry 是会话元数据，不等于给模型看的 CustomMessage。</desc><defs><marker id="260925-ch06-two-layer-messages-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8e7767"/></marker></defs><style>text{font-family:Geist,"Microsoft YaHei",sans-serif;fill:#1c1917}.title{font-size:29px;font-weight:650}.eyebrow{font:13px Geist,monospace;letter-spacing:2px;fill:#8a7464}.node{font-size:19px;font-weight:600}.body{font-size:18px}.small{font-size:17px;fill:#57534e}.accent{font-size:23px;fill:#b5523a}.source{font:13px Geist,monospace;fill:#8a7464}.edge{fill:none;stroke:#8e7767;stroke-width:1.8;marker-end:url(#260925-ch06-two-layer-messages-arrow)}</style><rect width="960" height="520" fill="#faf7f2"/><text x="42" y="48" class="title">内富外严：消息的两层边界</text><text x="42" y="78" class="eyebrow">PI SOURCE DIVE  /  v0.87.1</text><rect x="42" y="108" width="290" height="82" rx="9" fill="#ede9e1" stroke="#d6cec3"/><rect x="350" y="108" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="155" class="node">AgentMessage：应用内部</text><text x="367" y="140" class="body">标准四种 + 自定义消息</text><text x="367" y="168" class="body">bashExecution、custom、branchSummary 等</text><rect x="42" y="208" width="290" height="82" rx="9" fill="#ede9e1" stroke="#d6cec3"/><rect x="350" y="208" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="255" class="node">Message：模型抽象层</text><text x="367" y="240" class="body">system · user · assistant · toolResult</text><text x="367" y="268" class="body">SystemMessage 承载提示词与工具状态更新</text><rect x="42" y="308" width="290" height="82" rx="9" fill="#ede9e1" stroke="#d6cec3"/><rect x="350" y="308" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="355" class="node">转换边界</text><text x="367" y="340" class="body">应用的 convertToLlm 决定保留、转换或过滤</text><text x="367" y="368" class="body">coding-agent 的自定义对话消息通常转为 user</text><text x="42" y="440" class="small">CustomEntry 是会话元数据，不等于给模型看的 CustomMessage。</text><a href="https://github.com/earendil-works/pi/blob/f07218c4d4bbc12bef056a7058c3dd49dfe41abe/packages/coding-agent/src/core/messages.ts" target="_blank"><text x="42" y="498" class="source">packages/coding-agent/src/core/messages.ts</text></a></svg>
