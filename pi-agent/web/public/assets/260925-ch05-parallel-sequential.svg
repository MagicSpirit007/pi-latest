<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="260925-ch05-parallel-sequential-title 260925-ch05-parallel-sequential-desc"><title id="260925-ch05-parallel-sequential-title">整批串行，或先准备再并行</title><desc id="260925-ch05-parallel-sequential-desc">修改文件的工具可以借助执行模式避免同批操作竞争。</desc><defs><marker id="260925-ch05-parallel-sequential-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8e7767"/></marker></defs><style>text{font-family:Geist,"Microsoft YaHei",sans-serif;fill:#1c1917}.title{font-size:29px;font-weight:650}.eyebrow{font:13px Geist,monospace;letter-spacing:2px;fill:#8a7464}.node{font-size:19px;font-weight:600}.body{font-size:18px}.small{font-size:17px;fill:#57534e}.accent{font-size:23px;fill:#b5523a}.source{font:13px Geist,monospace;fill:#8a7464}.edge{fill:none;stroke:#8e7767;stroke-width:1.8;marker-end:url(#260925-ch05-parallel-sequential-arrow)}</style><rect width="960" height="520" fill="#faf7f2"/><text x="42" y="48" class="title">整批串行，或先准备再并行</text><text x="42" y="78" class="eyebrow">PI SOURCE DIVE  /  v0.87.1</text><rect x="42" y="108" width="290" height="82" rx="9" fill="#ede9e1" stroke="#d6cec3"/><rect x="350" y="108" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="155" class="node">串行批次</text><text x="367" y="140" class="body">任一工具 executionMode=sequential，或全局串行</text><text x="367" y="168" class="body">A 准备→执行→收尾，再轮到 B</text><rect x="42" y="208" width="290" height="82" rx="9" fill="#ede9e1" stroke="#d6cec3"/><rect x="350" y="208" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="255" class="node">并行批次</text><text x="367" y="240" class="body">A、B 依次准备；获准工具的执行与收尾并行</text><text x="367" y="268" class="body">end 事件按完成顺序，结果消息按调用顺序</text><rect x="42" y="308" width="290" height="82" rx="9" fill="#ede9e1" stroke="#d6cec3"/><rect x="350" y="308" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="355" class="node">批次停止提示</text><text x="367" y="340" class="body">每个最终结果都 terminate=true 才抑制自然续跑</text><text x="367" y="368" class="body">兄弟工具仍会完成；finishTurn / 队列另行决策</text><text x="42" y="440" class="small">修改文件的工具可以借助执行模式避免同批操作竞争。</text><a href="https://github.com/earendil-works/pi/blob/f07218c4d4bbc12bef056a7058c3dd49dfe41abe/packages/agent/src/agent-loop.ts" target="_blank"><text x="42" y="498" class="source">packages/agent/src/agent-loop.ts</text></a></svg>
