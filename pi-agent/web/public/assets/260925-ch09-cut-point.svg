<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="260925-ch09-cut-point-title 260925-ch09-cut-point-desc"><title id="260925-ch09-cut-point-title">切割点是“第一条保留的条目”</title><desc id="260925-ch09-cut-point-desc">split turn 在这里指用户任务跨度；不要与内核的一次模型 Turn 混淆。</desc><defs><marker id="260925-ch09-cut-point-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8e7767"/></marker></defs><style>text{font-family:Geist,"Microsoft YaHei",sans-serif;fill:#1c1917}.title{font-size:29px;font-weight:650}.eyebrow{font:13px Geist,monospace;letter-spacing:2px;fill:#8a7464}.node{font-size:19px;font-weight:600}.body{font-size:18px}.small{font-size:17px;fill:#57534e}.accent{font-size:23px;fill:#b5523a}.source{font:13px Geist,monospace;fill:#8a7464}.edge{fill:none;stroke:#8e7767;stroke-width:1.8;marker-end:url(#260925-ch09-cut-point-arrow)}</style><rect width="960" height="620" fill="#faf7f2"/><text x="42" y="48" class="title">切割点是“第一条保留的条目”</text><text x="42" y="78" class="eyebrow">PI SOURCE DIVE  /  v0.87.1</text><rect x="42" y="108" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="108" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="155" class="node">读取当前投影</text><text x="367" y="155" class="body">先应用已有压缩和 context_edit</text><path d="M332 149H346" class="edge"/><path d="M185 190V205" class="edge"/><rect x="42" y="208" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="208" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="255" class="node">从末尾累积近期预算</text><text x="367" y="255" class="body">达到 keepRecentTokens 后选择合法边界</text><path d="M332 249H346" class="edge"/><path d="M185 290V305" class="edge"/><rect x="42" y="308" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="308" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="355" class="node">边界可落在用户或助手等消息</text><text x="367" y="355" class="body">不能从 system 或孤立 toolResult 开始</text><path d="M332 349H346" class="edge"/><path d="M185 390V405" class="edge"/><rect x="42" y="408" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="408" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="455" class="node">若切在同一用户任务内部</text><text x="367" y="440" class="body">摘要覆盖旧历史 + 该任务前缀</text><text x="367" y="468" class="body">保留区从选中的 cut point 开始</text><path d="M332 449H346" class="edge"/><text x="42" y="540" class="small">split turn 在这里指用户任务跨度；不要与内核的一次模型 Turn 混淆。</text><a href="https://github.com/earendil-works/pi/blob/f07218c4d4bbc12bef056a7058c3dd49dfe41abe/packages/coding-agent/src/core/compaction/compaction.ts" target="_blank"><text x="42" y="598" class="source">packages/coding-agent/src/core/compaction/compaction.ts</text></a></svg>
