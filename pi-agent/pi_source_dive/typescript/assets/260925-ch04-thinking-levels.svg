<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="260925-ch04-thinking-levels-title 260925-ch04-thinking-levels-desc"><title id="260925-ch04-thinking-levels-title">统一思考级别，按模型能力落地</title><desc id="260925-ch04-thinking-levels-desc">统一名字不意味着各模型的开销相同，也不保证都支持最高级别。</desc><defs><marker id="260925-ch04-thinking-levels-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8e7767"/></marker></defs><style>text{font-family:Geist,"Microsoft YaHei",sans-serif;fill:#1c1917}.title{font-size:29px;font-weight:650}.eyebrow{font:13px Geist,monospace;letter-spacing:2px;fill:#8a7464}.node{font-size:19px;font-weight:600}.body{font-size:18px}.small{font-size:17px;fill:#57534e}.accent{font-size:23px;fill:#b5523a}.source{font:13px Geist,monospace;fill:#8a7464}.edge{fill:none;stroke:#8e7767;stroke-width:1.8;marker-end:url(#260925-ch04-thinking-levels-arrow)}</style><rect width="960" height="620" fill="#faf7f2"/><text x="42" y="48" class="title">统一思考级别，按模型能力落地</text><text x="42" y="78" class="eyebrow">PI SOURCE DIVE  /  v0.87.1</text><rect x="42" y="108" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="108" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="155" class="node">调用方意图</text><text x="367" y="155" class="body">off · minimal · low · medium · high · xhigh · max</text><path d="M332 149H346" class="edge"/><path d="M185 190V205" class="edge"/><rect x="42" y="208" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="208" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="255" class="node">模型能力约束</text><text x="367" y="255" class="body">clampThinkingLevel：选择该模型支持的级别</text><path d="M332 249H346" class="edge"/><path d="M185 290V305" class="edge"/><rect x="42" y="308" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="308" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="355" class="node">协议参数</text><text x="367" y="355" class="body">适配为预算、effort 等供应商字段</text><path d="M332 349H346" class="edge"/><path d="M185 390V405" class="edge"/><rect x="42" y="408" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="408" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="455" class="node">返回思考内容</text><text x="367" y="455" class="body">统一为 thinking 块；是否返回由模型与协议决定</text><path d="M332 449H346" class="edge"/><text x="42" y="540" class="small">统一名字不意味着各模型的开销相同，也不保证都支持最高级别。</text><a href="https://github.com/earendil-works/pi/blob/f07218c4d4bbc12bef056a7058c3dd49dfe41abe/packages/ai/src/types.ts" target="_blank"><text x="42" y="598" class="source">packages/ai/src/types.ts</text></a></svg>
