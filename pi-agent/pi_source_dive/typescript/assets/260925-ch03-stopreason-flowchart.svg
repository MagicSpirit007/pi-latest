<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="260925-ch03-stopreason-flowchart-title 260925-ch03-stopreason-flowchart-desc"><title id="260925-ch03-stopreason-flowchart-title">响应之后，谁决定继续？</title><desc id="260925-ch03-stopreason-flowchart-desc">继续前执行 prepareNextTurn；每次请求前执行 prepareRequest。</desc><defs><marker id="260925-ch03-stopreason-flowchart-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8e7767"/></marker></defs><style>text{font-family:Geist,"Microsoft YaHei",sans-serif;fill:#1c1917}.title{font-size:29px;font-weight:650}.eyebrow{font:13px Geist,monospace;letter-spacing:2px;fill:#8a7464}.node{font-size:19px;font-weight:600}.body{font-size:18px}.small{font-size:17px;fill:#57534e}.accent{font-size:23px;fill:#b5523a}.source{font:13px Geist,monospace;fill:#8a7464}.edge{fill:none;stroke:#8e7767;stroke-width:1.8;marker-end:url(#260925-ch03-stopreason-flowchart-arrow)}</style><rect width="960" height="620" fill="#faf7f2"/><text x="42" y="48" class="title">响应之后，谁决定继续？</text><text x="42" y="78" class="eyebrow">PI SOURCE DIVE  /  v0.87.1</text><rect x="42" y="108" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="108" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="155" class="node">收到 AssistantMessage</text><text x="367" y="140" class="body">error / aborted：调用 finishTurn 后硬退出</text><text x="367" y="168" class="body">length + toolCall：产出失败结果，不执行工具</text><path d="M332 149H346" class="edge"/><path d="M185 190V205" class="edge"/><rect x="42" y="208" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="208" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="255" class="node">正常响应的工具批次</text><text x="367" y="255" class="body">准备 → 执行 → 收尾；全批 terminate 才抑制自然续跑</text><path d="M332 249H346" class="edge"/><path d="M185 290V305" class="edge"/><rect x="42" y="308" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="308" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="355" class="node">finishTurn → turn_end</text><text x="367" y="340" class="body">end：退出且保留未消费队列</text><text x="367" y="368" class="body">continue：确保下一次请求；undefined：通常调度</text><path d="M332 349H346" class="edge"/><path d="M185 390V405" class="edge"/><rect x="42" y="408" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="408" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="455" class="node">继续，或退出</text><text x="367" y="440" class="body">工具结果 / steering → 下一轮；再检查 follow-up</text><text x="367" y="468" class="body">都没有，也无待兑现 continue → agent_end</text><path d="M332 449H346" class="edge"/><text x="42" y="540" class="small">继续前执行 prepareNextTurn；每次请求前执行 prepareRequest。</text><a href="https://github.com/earendil-works/pi/blob/f07218c4d4bbc12bef056a7058c3dd49dfe41abe/packages/agent/src/agent-loop.ts" target="_blank"><text x="42" y="598" class="source">packages/agent/src/agent-loop.ts</text></a></svg>
