<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="260925-ch03-steering-vs-followup-title 260925-ch03-steering-vs-followup-desc"><title id="260925-ch03-steering-vs-followup-title">两种队列，两种用户意图</title><desc id="260925-ch03-steering-vs-followup-desc">steering 不会在一个工具批次执行到一半时取消其余工具。</desc><defs><marker id="260925-ch03-steering-vs-followup-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8e7767"/></marker></defs><style>text{font-family:Geist,"Microsoft YaHei",sans-serif;fill:#1c1917}.title{font-size:29px;font-weight:650}.eyebrow{font:13px Geist,monospace;letter-spacing:2px;fill:#8a7464}.node{font-size:19px;font-weight:600}.body{font-size:18px}.small{font-size:17px;fill:#57534e}.accent{font-size:23px;fill:#b5523a}.source{font:13px Geist,monospace;fill:#8a7464}.edge{fill:none;stroke:#8e7767;stroke-width:1.8;marker-end:url(#260925-ch03-steering-vs-followup-arrow)}</style><rect width="960" height="520" fill="#faf7f2"/><text x="42" y="48" class="title">两种队列，两种用户意图</text><text x="42" y="78" class="eyebrow">PI SOURCE DIVE  /  v0.87.1</text><rect x="42" y="108" width="290" height="82" rx="9" fill="#ede9e1" stroke="#d6cec3"/><rect x="350" y="108" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="155" class="node">steering</text><text x="367" y="140" class="body">“先别改文件”</text><text x="367" y="168" class="body">在循环的队列读取点进入下一次请求</text><rect x="42" y="208" width="290" height="82" rx="9" fill="#ede9e1" stroke="#d6cec3"/><rect x="350" y="208" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="255" class="node">follow-up</text><text x="367" y="240" class="body">“修完顺便跑测试”</text><text x="367" y="268" class="body">当前工具链与 steering 处理后，外层循环读取</text><rect x="42" y="308" width="290" height="82" rx="9" fill="#ede9e1" stroke="#d6cec3"/><rect x="350" y="308" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="355" class="node">finishTurn 决策</text><text x="367" y="340" class="body">end：保留尚未消费的消息</text><text x="367" y="368" class="body">continue：与工具、队列带来的续转合并</text><text x="42" y="440" class="small">steering 不会在一个工具批次执行到一半时取消其余工具。</text><a href="https://github.com/earendil-works/pi/blob/f07218c4d4bbc12bef056a7058c3dd49dfe41abe/packages/agent/src/agent-loop.ts" target="_blank"><text x="42" y="498" class="source">packages/agent/src/agent-loop.ts</text></a></svg>
