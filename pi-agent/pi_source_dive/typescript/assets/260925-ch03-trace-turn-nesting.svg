<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="260925-ch03-trace-turn-nesting-title 260925-ch03-trace-turn-nesting-desc"><title id="260925-ch03-trace-turn-nesting-title">一次用户任务，不一定只有一次底层运行</title><desc id="260925-ch03-trace-turn-nesting-desc">agent_end 结束一趟 Loop；agent_settled 标记本次会话活动收尾。</desc><defs><marker id="260925-ch03-trace-turn-nesting-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8e7767"/></marker></defs><style>text{font-family:Geist,"Microsoft YaHei",sans-serif;fill:#1c1917}.title{font-size:29px;font-weight:650}.eyebrow{font:13px Geist,monospace;letter-spacing:2px;fill:#8a7464}.node{font-size:19px;font-weight:600}.body{font-size:18px}.small{font-size:17px;fill:#57534e}.accent{font-size:23px;fill:#b5523a}.source{font:13px Geist,monospace;fill:#8a7464}.edge{fill:none;stroke:#8e7767;stroke-width:1.8;marker-end:url(#260925-ch03-trace-turn-nesting-arrow)}</style><rect width="960" height="620" fill="#faf7f2"/><text x="42" y="48" class="title">一次用户任务，不一定只有一次底层运行</text><text x="42" y="78" class="eyebrow">PI SOURCE DIVE  /  v0.87.1</text><rect x="42" y="108" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="108" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="155" class="node">Session 活动开始</text><text x="367" y="155" class="body">输入进入会话，准备当前上下文</text><path d="M332 149H346" class="edge"/><path d="M185 190V205" class="edge"/><rect x="42" y="208" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="208" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="255" class="node">Agent 运行</text><text x="367" y="255" class="body">agent_start → Turn 1 → Turn 2 → agent_end</text><path d="M332 249H346" class="edge"/><path d="M185 290V305" class="edge"/><rect x="42" y="308" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="308" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="355" class="node">自动后续工作</text><text x="367" y="355" class="body">重试、压缩、待处理消息可能再次启动 Agent</text><path d="M332 349H346" class="edge"/><path d="M185 390V405" class="edge"/><rect x="42" y="408" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="408" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="455" class="node">Session 收尾</text><text x="367" y="455" class="body">agent_before_settle → 如无续跑 → agent_settled</text><path d="M332 449H346" class="edge"/><text x="42" y="540" class="small">agent_end 结束一趟 Loop；agent_settled 标记本次会话活动收尾。</text><a href="https://github.com/earendil-works/pi/blob/f07218c4d4bbc12bef056a7058c3dd49dfe41abe/packages/coding-agent/src/core/agent-session.ts" target="_blank"><text x="42" y="598" class="source">packages/coding-agent/src/core/agent-session.ts</text></a></svg>
