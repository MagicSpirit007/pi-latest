<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="260925-ch04-translation-company-title 260925-ch04-translation-company-desc"><title id="260925-ch04-translation-company-title">翻译公司如何分工</title><desc id="260925-ch04-translation-company-desc">主入口使用显式集合；/compat 保留全局 getModel / stream 等便捷入口。</desc><defs><marker id="260925-ch04-translation-company-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8e7767"/></marker></defs><style>text{font-family:Geist,"Microsoft YaHei",sans-serif;fill:#1c1917}.title{font-size:29px;font-weight:650}.eyebrow{font:13px Geist,monospace;letter-spacing:2px;fill:#8a7464}.node{font-size:19px;font-weight:600}.body{font-size:18px}.small{font-size:17px;fill:#57534e}.accent{font-size:23px;fill:#b5523a}.source{font:13px Geist,monospace;fill:#8a7464}.edge{fill:none;stroke:#8e7767;stroke-width:1.8;marker-end:url(#260925-ch04-translation-company-arrow)}</style><rect width="960" height="620" fill="#faf7f2"/><text x="42" y="48" class="title">翻译公司如何分工</text><text x="42" y="78" class="eyebrow">PI SOURCE DIVE  /  v0.87.1</text><rect x="42" y="108" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="108" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="155" class="node">ModelRuntime</text><text x="367" y="155" class="body">产品层：模型配置、认证与 Models 集合</text><path d="M332 149H346" class="edge"/><path d="M185 190V205" class="edge"/><rect x="42" y="208" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="208" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="255" class="node">Models + Provider</text><text x="367" y="255" class="body">选择模型，解析该供应商的认证与调用能力</text><path d="M332 249H346" class="edge"/><path d="M185 290V305" class="edge"/><rect x="42" y="308" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="308" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="355" class="node">API 实现</text><text x="367" y="355" class="body">把 TranscriptContext 翻译为协议请求</text><path d="M332 349H346" class="edge"/><path d="M185 390V405" class="edge"/><rect x="42" y="408" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="408" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="455" class="node">统一流式事件</text><text x="367" y="440" class="body">AssistantMessageEventStream</text><text x="367" y="468" class="body">流式增量与最终统一消息返回调用方</text><path d="M332 449H346" class="edge"/><text x="42" y="540" class="small">主入口使用显式集合；/compat 保留全局 getModel / stream 等便捷入口。</text><a href="https://github.com/earendil-works/pi/blob/f07218c4d4bbc12bef056a7058c3dd49dfe41abe/packages/coding-agent/src/core/model-runtime.ts" target="_blank"><text x="42" y="598" class="source">packages/coding-agent/src/core/model-runtime.ts</text></a></svg>
