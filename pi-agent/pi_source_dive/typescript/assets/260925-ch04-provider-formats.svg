<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="260925-ch04-provider-formats-title 260925-ch04-provider-formats-desc"><title id="260925-ch04-provider-formats-title">同一条输入，四种协议表达</title><desc id="260925-ch04-provider-formats-desc">这里比较协议格式；同一供应商也可能提供多种 API。</desc><defs><marker id="260925-ch04-provider-formats-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8e7767"/></marker></defs><style>text{font-family:Geist,"Microsoft YaHei",sans-serif;fill:#1c1917}.title{font-size:29px;font-weight:650}.eyebrow{font:13px Geist,monospace;letter-spacing:2px;fill:#8a7464}.node{font-size:19px;font-weight:600}.body{font-size:18px}.small{font-size:17px;fill:#57534e}.accent{font-size:23px;fill:#b5523a}.source{font:13px Geist,monospace;fill:#8a7464}.edge{fill:none;stroke:#8e7767;stroke-width:1.8;marker-end:url(#260925-ch04-provider-formats-arrow)}</style><rect width="960" height="620" fill="#faf7f2"/><text x="42" y="48" class="title">同一条输入，四种协议表达</text><text x="42" y="78" class="eyebrow">PI SOURCE DIVE  /  v0.87.1</text><rect x="42" y="108" width="290" height="82" rx="9" fill="#ede9e1" stroke="#d6cec3"/><rect x="350" y="108" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="155" class="node">Anthropic Messages</text><text x="367" y="140" class="body">content: [{ type: &quot;text&quot;, text: &quot;...&quot; }]</text><text x="367" y="168" class="body">工具结果通常放在 user 的 tool_result 块</text><rect x="42" y="208" width="290" height="82" rx="9" fill="#ede9e1" stroke="#d6cec3"/><rect x="350" y="208" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="255" class="node">OpenAI Completions</text><text x="367" y="240" class="body">content: &quot;...&quot;</text><text x="367" y="268" class="body">工具结果使用 role: &quot;tool&quot;</text><rect x="42" y="308" width="290" height="82" rx="9" fill="#ede9e1" stroke="#d6cec3"/><rect x="350" y="308" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="355" class="node">Google Generative AI</text><text x="367" y="340" class="body">parts: [{ text: &quot;...&quot; }]</text><text x="367" y="368" class="body">工具结果使用 functionResponse</text><rect x="42" y="408" width="290" height="82" rx="9" fill="#ede9e1" stroke="#d6cec3"/><rect x="350" y="408" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="455" class="node">Amazon Bedrock Converse</text><text x="367" y="440" class="body">content: [{ text: &quot;...&quot; }]</text><text x="367" y="468" class="body">工具结果使用 toolResult 块</text><text x="42" y="540" class="small">这里比较协议格式；同一供应商也可能提供多种 API。</text><a href="https://github.com/earendil-works/pi/blob/f07218c4d4bbc12bef056a7058c3dd49dfe41abe/packages/ai/src/types.ts" target="_blank"><text x="42" y="598" class="source">packages/ai/src/types.ts</text></a></svg>
