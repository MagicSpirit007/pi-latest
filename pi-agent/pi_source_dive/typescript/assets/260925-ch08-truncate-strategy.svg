<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="260925-ch08-truncate-strategy-title 260925-ch08-truncate-strategy-desc"><title id="260925-ch08-truncate-strategy-title">先控制工具输出的体积</title><desc id="260925-ch08-truncate-strategy-desc">单行、字节和行数限制要分别处理；截断不同于会话压缩。</desc><defs><marker id="260925-ch08-truncate-strategy-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8e7767"/></marker></defs><style>text{font-family:Geist,"Microsoft YaHei",sans-serif;fill:#1c1917}.title{font-size:29px;font-weight:650}.eyebrow{font:13px Geist,monospace;letter-spacing:2px;fill:#8a7464}.node{font-size:19px;font-weight:600}.body{font-size:18px}.small{font-size:17px;fill:#57534e}.accent{font-size:23px;fill:#b5523a}.source{font:13px Geist,monospace;fill:#8a7464}.edge{fill:none;stroke:#8e7767;stroke-width:1.8;marker-end:url(#260925-ch08-truncate-strategy-arrow)}</style><rect width="960" height="520" fill="#faf7f2"/><text x="42" y="48" class="title">先控制工具输出的体积</text><text x="42" y="78" class="eyebrow">PI SOURCE DIVE  /  v0.87.1</text><rect x="42" y="108" width="290" height="82" rx="9" fill="#ede9e1" stroke="#d6cec3"/><rect x="350" y="108" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="155" class="node">默认双重上限</text><text x="367" y="140" class="body">2000 行 / 50 KB，先到者生效</text><text x="367" y="168" class="body">具体工具还可使用自己的限制</text><rect x="42" y="208" width="290" height="82" rx="9" fill="#ede9e1" stroke="#d6cec3"/><rect x="350" y="208" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="255" class="node">read / grep 等</text><text x="367" y="240" class="body">保留开头，让入口与匹配先被看到</text><text x="367" y="268" class="body">超限时附上截断信息，指引继续读取</text><rect x="42" y="308" width="290" height="82" rx="9" fill="#ede9e1" stroke="#d6cec3"/><rect x="350" y="308" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="355" class="node">bash / powershell</text><text x="367" y="340" class="body">保留末尾，优先保留结论与报错</text><text x="367" y="368" class="body">完整输出可落盘；UTF-8 边界保持完整</text><text x="42" y="440" class="small">单行、字节和行数限制要分别处理；截断不同于会话压缩。</text><a href="https://github.com/earendil-works/pi/blob/f07218c4d4bbc12bef056a7058c3dd49dfe41abe/packages/coding-agent/src/core/tools/truncate.ts" target="_blank"><text x="42" y="498" class="source">packages/coding-agent/src/core/tools/truncate.ts</text></a></svg>
