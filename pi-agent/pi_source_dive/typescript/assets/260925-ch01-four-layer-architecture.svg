<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="260925-ch01-four-layer-architecture-title 260925-ch01-four-layer-architecture-desc"><title id="260925-ch01-four-layer-architecture-title">三层主线，一个终端侧库</title><desc id="260925-ch01-four-layer-architecture-desc">依赖由上到下；pi-tui 与 Agent 内核没有上下层调用关系。</desc><defs><marker id="260925-ch01-four-layer-architecture-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8e7767"/></marker></defs><style>text{font-family:Geist,"Microsoft YaHei",sans-serif;fill:#1c1917}.title{font-size:29px;font-weight:650}.eyebrow{font:13px Geist,monospace;letter-spacing:2px;fill:#8a7464}.node{font-size:19px;font-weight:600}.body{font-size:18px}.small{font-size:17px;fill:#57534e}.accent{font-size:23px;fill:#b5523a}.source{font:13px Geist,monospace;fill:#8a7464}.edge{fill:none;stroke:#8e7767;stroke-width:1.8;marker-end:url(#260925-ch01-four-layer-architecture-arrow)}</style><rect width="960" height="620" fill="#faf7f2"/><text x="42" y="48" class="title">三层主线，一个终端侧库</text><text x="42" y="78" class="eyebrow">PI SOURCE DIVE  /  v0.87.1</text><rect x="42" y="108" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="108" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="155" class="node">pi-coding-agent</text><text x="367" y="140" class="body">CLI / SDK · AgentSession</text><text x="367" y="168" class="body">会话、工具、资源、扩展</text><path d="M332 149H346" class="edge"/><path d="M185 190V205" class="edge"/><rect x="42" y="208" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="208" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="255" class="node">pi-agent-core</text><text x="367" y="240" class="body">Agent · Loop · 队列</text><text x="367" y="268" class="body">模型响应 → 工具结果 → 下一轮</text><path d="M332 249H346" class="edge"/><path d="M185 290V305" class="edge"/><rect x="42" y="308" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="308" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="355" class="node">pi-ai</text><text x="367" y="340" class="body">Models · Provider · API</text><text x="367" y="368" class="body">统一消息、流式事件、认证</text><path d="M332 349H346" class="edge"/><rect x="42" y="408" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="408" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="455" class="node">pi-tui（侧库）</text><text x="367" y="440" class="body">终端组件与差分渲染</text><text x="367" y="468" class="body">由 coding-agent 依赖，独立于核心循环</text><path d="M332 449H346" class="edge"/><text x="42" y="540" class="small">依赖由上到下；pi-tui 与 Agent 内核没有上下层调用关系。</text><a href="https://github.com/earendil-works/pi/blob/f07218c4d4bbc12bef056a7058c3dd49dfe41abe/packages/coding-agent/src/core/sdk.ts" target="_blank"><text x="42" y="598" class="source">packages/coding-agent/src/core/sdk.ts</text></a></svg>
