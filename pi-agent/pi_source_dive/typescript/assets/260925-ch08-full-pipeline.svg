roke="#d6cec3"/><text x="58" y="355" class="node">两类 context 钩子</text><text x="367" y="340" class="body">context：先变换非 system 消息</text><text x="367" y="368" class="body">context_with_system：再接管完整消息</text><path d="M332 349H346" class="edge"/><path d="M185 390V405" class="edge"/><rect x="42" y="408" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="408" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="455" class="node">转换与归一化</text><text x="367" y="440" class="body">convertToLlm → normalizeContext</text><text x="367" y="468" class="body">转换应用消息，得到 TranscriptContext</text><path d="M332 449H346" class="edge"/><path d="M185 490V505" class="edge"/><rect x="42" y="508" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="508" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="555" class="node">Models / Provider / API</text><text x="367" y="555" class="body">认证、协议翻译、模型请求</text><path d="M332 549H346" class="edge"/><text x="42" y="640" class="small">context 钩子影响本次请求；持久修改用 context_edit 等会话条目。</text><a href="https://github.com/earendil-works/pi/blob/f07218c4d4bbc12bef056a7058c3dd49dfe41abe/packages/coding-agent/src/core/agent-session.ts" target="_blank"><text x="42" y="698" class="source">packages/coding-agent/src/core/agent-session.ts</text></a></svg>
